[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "looker-builder"
version = "0.1.0"
description = "Looker LookML Dashboard Builder CLI and Agent using Looker Managed MCP and Dashboard Import API"
requires-python = ">=3.11"
authors = [{name = "Brett Guenther"}]
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "google-genai>=1.0.0",
]

[project.scripts]
looker-builder = "looker_builder.cli:main"

[tool.setuptools.package-data]
"looker_builder" = ["resources/**/*", "resources/**/**/*"]
